# Flink 1.18 cluster config for ChangeLake Phase 5 (G6 recovery + DWD/ADS)
# Task slots ≥10 so ODS + DWD + ADS batch + sql-client collect can schedule together.
jobmanager.rpc.address: jobmanager
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m
taskmanager.memory.process.size: 1728m
taskmanager.numberOfTaskSlots: 10
parallelism.default: 2
rest.port: 8081
rest.address: 0.0.0.0
rest.bind-address: 0.0.0.0

# Checkpoint / savepoint paths (named volumes mounted at these paths)
state.backend: hashmap
state.checkpoints.dir: file:///checkpoints
state.savepoints.dir: file:///savepoints
execution.checkpointing.interval: 10s
execution.checkpointing.min-pause: 5s
execution.checkpointing.timeout: 10min
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

# Classloader (needed when loading Paimon JARs from /opt/flink/lib)
classloader.resolve-order: parent-first

# Failover after TaskManager kill (G6). JM stays up; restore from last checkpoint.
restart-strategy.type: fixed-delay
restart-strategy.fixed-delay.attempts: 10
restart-strategy.fixed-delay.delay: 5s
