# ChangeLake Phase 3 — MySQL + Flink JM/TM + MinIO (Paimon S3 warehouse)
# CDC jars (flink-sql-connector-mysql-cdc + mysql-connector-j + paimon-s3) from ./flink/lib
# via container entrypoint. Pipeline started by scripts/start_pipeline.sh.
# Demo credentials only — see README / .env.example.
#
# Architecture Decision: Paimon warehouse is s3://changelake/warehouse on MinIO.
# Local file:///warehouse bind mounts were removed — Docker Desktop / VirtioFS Mkdirs
# failures made LocalFileIO unreliable for Paimon writers.

services:
  mysql:
    image: mysql:8.0.40
    container_name: changelake-mysql
    hostname: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changelake}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-changelake}
      MYSQL_USER: ${MYSQL_USER:-changelake}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changelake}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/changelake.cnf:ro
      - ./mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./mysql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchangelake"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    networks:
      - changelake

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: changelake-minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - changelake

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: changelake-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/$${MINIO_BUCKET}
        mc anonymous set none local/$${MINIO_BUCKET} || true
        echo "[minio-init] bucket ready: $${MINIO_BUCKET}"
        mc ls local/
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-changelake}
    networks:
      - changelake
    restart: "no"

  jobmanager:
    image: flink:1.18.1-scala_2.12-java17
    container_name: changelake-jobmanager
    hostname: jobmanager
    # demo-only: named checkpoint volumes are root-owned; Flink image USER=flink cannot mkdir
    user: "0"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /checkpoints /savepoints
        chmod -R 777 /checkpoints /savepoints || true
        if compgen -G "/jars/*.jar" > /dev/null; then
          cp -f /jars/*.jar /opt/flink/lib/
          echo "[changelake] installed jars from /jars into /opt/flink/lib"
          ls -1 /opt/flink/lib/*paimon* /opt/flink/lib/*hadoop* /opt/flink/lib/*mysql* 2>/dev/null || true
        else
          echo "[changelake] no jars in /jars yet (run: make jars)"
        fi
        exec /docker-entrypoint.sh jobmanager
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      PAIMON_WAREHOUSE: ${PAIMON_WAREHOUSE:-s3://changelake/warehouse}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        rest.bind-address: 0.0.0.0
        state.backend: hashmap
        state.checkpoints.dir: file:///checkpoints
        state.savepoints.dir: file:///savepoints
        execution.checkpointing.interval: 30s
        classloader.resolve-order: parent-first
    volumes:
      - ./flink/lib:/jars:ro
      - ./flink/sql:/opt/flink/sql-changelake:ro
      - ./flink/config/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml.changelake:ro
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks:
      - changelake

  taskmanager:
    image: flink:1.18.1-scala_2.12-java17
    container_name: changelake-taskmanager
    hostname: taskmanager
    user: "0"
    depends_on:
      jobmanager:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        mkdir -p /checkpoints /savepoints
        chmod -R 777 /checkpoints /savepoints || true
        if compgen -G "/jars/*.jar" > /dev/null; then
          cp -f /jars/*.jar /opt/flink/lib/
          echo "[changelake] installed jars from /jars into /opt/flink/lib"
        else
          echo "[changelake] no jars in /jars yet (run: make jars)"
        fi
        exec /docker-entrypoint.sh taskmanager
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      PAIMON_WAREHOUSE: ${PAIMON_WAREHOUSE:-s3://changelake/warehouse}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        state.backend: hashmap
        state.checkpoints.dir: file:///checkpoints
        state.savepoints.dir: file:///savepoints
        execution.checkpointing.interval: 30s
        classloader.resolve-order: parent-first
    volumes:
      - ./flink/lib:/jars:ro
      - ./flink/sql:/opt/flink/sql-changelake:ro
      - ./flink/config/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml.changelake:ro
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
    networks:
      - changelake

volumes:
  mysql_data:
    name: changelake_mysql_data
  minio_data:
    name: changelake_minio_data
  flink_checkpoints:
    name: changelake_flink_checkpoints
  flink_savepoints:
    name: changelake_flink_savepoints

networks:
  changelake:
    name: changelake_net
